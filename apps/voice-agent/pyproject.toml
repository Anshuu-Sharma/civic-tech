[project]
name = "jansunwai-voice-agent"
version = "1.0.0"
description = "LiveKit voice agent for JanSunwai AI civic grievance platform"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[silero,turn-detector]~=1.3.0",
    "livekit-plugins-deepgram>=1.0.0",
    "livekit-plugins-elevenlabs>=1.0.0",
    "livekit-plugins-google>=1.3.0",
    "livekit-api>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jansunwai_agent"]
